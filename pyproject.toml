[tool.ruff]
target-version = "py310"
line-length = 120
src = ["addons/devops_server_monitor"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# Odoo loads submodules via side-effect imports in __init__.py
[tool.ruff.lint.per-file-ignores]
"addons/devops_server_monitor/**/__init__.py" = ["F401", "I001"]
