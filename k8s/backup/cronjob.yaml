apiVersion: batch/v1
kind: CronJob
metadata:
  name: odoo-backup
  namespace: odoo
  labels:
    app.kubernetes.io/name: odoo-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 7200
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: odoo-backup
            azure.workload.identity/use: "true"
        spec:
          serviceAccountName: odoo-backup
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 101
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 50Gi
            - name: filestore
              persistentVolumeClaim:
                claimName: odoo-prod-filestore-rwx
            - name: scripts
              configMap:
                name: odoo-backup-scripts
                defaultMode: 0555
          initContainers:
            - name: pg-dump
              image: postgres:16
              envFrom:
                - secretRef:
                    name: odoo-db
              env:
                - name: PGSSLMODE
                  value: require
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: odoo-db
                      key: DB_PASSWORD
              command:
                - /bin/bash
                - -ec
                - |
                  echo "[backup] pg_dump ${POSTGRES_DB} @ ${POSTGRES_HOST}..."
                  chmod 0777 /work
                  pg_dump -h "$POSTGRES_HOST" -U "$DB_USER" -p 5432 -Fc "$POSTGRES_DB" -f /work/db.dump
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
            - name: filestore-archive
              image: alpine:3.20
              securityContext:
                runAsUser: 101
                runAsGroup: 101
              envFrom:
                - secretRef:
                    name: odoo-db
              command:
                - /bin/sh
                - -ec
                - |
                  db="${POSTGRES_DB:-odoo_devops_lab}"
                  root="/var/lib/odoo"
                  if [ -d "${root}/filestore/${db}" ]; then
                    echo "[backup] tar filestore/${db}..."
                    tar czf /work/filestore.tar.gz -C "${root}/filestore" "$db"
                  else
                    echo "[backup] no filestore/${db} on PVC yet — empty archive (DB dump still applies)"
                    ls -la "${root}" >&2 || true
                    mkdir -p "/work/stub/filestore/${db}"
                    tar czf /work/filestore.tar.gz -C /work/stub/filestore "$db"
                  fi
              volumeMounts:
                - name: filestore
                  mountPath: /var/lib/odoo
                  readOnly: true
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
          containers:
            - name: upload
              image: mcr.microsoft.com/azure-cli:2.65.0
              envFrom:
                - configMapRef:
                    name: odoo-backup-config
              env:
                - name: WORKDIR
                  value: /work
              command:
                - /bin/bash
                - /scripts/upload.sh
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
