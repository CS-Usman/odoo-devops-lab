apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.5
    helm:
      values: |
        installCRDs: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# Azure Key Vault sync — requires ClusterSecretStore + seeded Key Vault secrets (scripts/seed-keyvault-secrets.sh).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odoo-external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CS-Usman/odoo-devops-lab
    targetRevision: main
    path: k8s/external-secrets
    directory:
      include: "externalsecret-*-azurekv.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: odoo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
