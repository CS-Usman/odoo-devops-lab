apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odoo-backup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  project: default
  source:
    repoURL: https://github.com/CS-Usman/odoo-devops-lab
    targetRevision: main
    path: k8s/backup
  destination:
    server: https://kubernetes.default.svc
    namespace: odoo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
  # odoo-backup-config + ServiceAccount: install-backup-cronjob.sh (not in kustomization).
