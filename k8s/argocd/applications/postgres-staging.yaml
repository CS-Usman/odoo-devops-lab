apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CS-Usman/odoo-devops-lab
    targetRevision: main
    path: helm/postgres-staging
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: odoo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
