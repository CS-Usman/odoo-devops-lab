# Argo CD — staging tracks git branch `staging` + staging/image-tag.yaml (CI on push to staging).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odoo-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/CS-Usman/odoo-devops-lab
    targetRevision: staging
    path: helm/odoo
    helm:
      valueFiles:
        - values-staging.yaml
        - values-ghcr-pull.yaml
        - environments/staging/image-tag.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: odoo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
