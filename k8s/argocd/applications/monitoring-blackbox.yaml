apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-blackbox
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-blackbox-exporter
      targetRevision: 9.0.0
      helm:
        releaseName: blackbox
        valueFiles:
          - $values/helm/monitoring/blackbox-values.yaml
    - repoURL: https://github.com/CS-Usman/odoo-devops-lab
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
