# k3s built-in Traefik — expose :80 (prod) and :8080 (staging).
# Apply after k3s install: sudo kubectl apply -f k8s/traefik-helmchartconfig.yaml
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        port: 80
        exposedPort: 80
        expose:
          default: true
      webstaging:
        port: 8080
        exposedPort: 8080
        expose:
          default: true
      websecure:
        expose:
          default: false
