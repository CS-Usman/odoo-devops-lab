# k3s built-in Traefik — expose :80 (prod) and :8080 (staging).
# Installed by install-k3s.sh into /var/lib/rancher/k3s/server/manifests/
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        exposedPort: 80
      webstaging:
        port: 8080
        exposedPort: 8080
        expose:
          default: true
      websecure:
        expose:
          default: false
