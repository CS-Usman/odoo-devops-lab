apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-staging-auth
  namespace: odoo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv-backend
  target:
    name: postgres-staging-auth
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: odoo-staging-postgres-db
    - secretKey: POSTGRES_USER
      remoteRef:
        key: odoo-staging-postgres-user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: odoo-staging-postgres-password
