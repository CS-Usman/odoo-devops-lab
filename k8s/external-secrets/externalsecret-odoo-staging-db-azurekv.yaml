apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo-staging-db
  namespace: odoo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv-backend
  target:
    name: odoo-staging-db
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: odoo-staging-db-host
    - secretKey: DB_USER
      remoteRef:
        key: odoo-staging-db-user
    - secretKey: DB_PASSWORD
      remoteRef:
        key: odoo-staging-db-password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: odoo-staging-postgres-db
