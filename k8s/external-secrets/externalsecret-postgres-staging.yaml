apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-staging
  namespace: odoo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: postgres-staging
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: odoo/staging
        property: STAGING_DB_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: odoo/staging
        property: STAGING_DB_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: odoo/staging
        property: POSTGRES_DB
