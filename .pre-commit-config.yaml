# Local checks — run: pre-commit install && pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        files: ^addons/devops_server_monitor/
      - id: ruff-format
        files: ^addons/devops_server_monitor/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: hadolint
        name: hadolint (docker)
        entry: bash -c 'docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --ignore DL3008 - < "$1"' --
        language: system
        files: Dockerfile
        pass_filenames: true

      - id: validate-devops-xml
        name: validate devops_server_monitor XML
        language: python
        additional_dependencies: [lxml]
        entry: python -c "import sys; from lxml import etree; [etree.parse(f) for f in sys.argv[1:]]"
        files: ^addons/devops_server_monitor/.*\.xml$
        pass_filenames: true
