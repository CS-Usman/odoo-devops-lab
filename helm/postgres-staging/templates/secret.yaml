{{- if and (not .Values.existingSecret) .Values.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres-staging.fullname" . }}-auth
  labels:
    {{- include "postgres-staging.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.auth.database | quote }}
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
{{- end }}
