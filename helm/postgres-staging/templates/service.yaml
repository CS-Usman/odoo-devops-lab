apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres-staging.fullname" . }}
  labels:
    {{- include "postgres-staging.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
  selector:
    app.kubernetes.io/name: {{ include "postgres-staging.fullname" . }}
