fullnameOverride: postgres-staging

image:
  repository: postgres
  tag: "16"
  pullPolicy: IfNotPresent

auth:
  database: odoo_staging
  username: odoo_staging
  # Set via existingSecret in production deploy
  password: ""

existingSecret: postgres-staging-auth

persistence:
  enabled: true
  storageClass: managed-csi
  size: 32Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

service:
  port: 5432
