apiVersion: v1
kind: Service
metadata:
  name: {{ include "odoo.fullname" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "odoo.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: longpolling
      port: {{ .Values.service.longpollingPort }}
      targetPort: longpolling
