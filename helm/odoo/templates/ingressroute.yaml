{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "odoo.fullname" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint }}
  routes:
    - match: PathPrefix(`/websocket`)
      kind: Rule
      priority: 100
      services:
        - name: {{ include "odoo.fullname" . }}
          port: {{ .Values.service.longpollingPort }}
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: {{ include "odoo.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
