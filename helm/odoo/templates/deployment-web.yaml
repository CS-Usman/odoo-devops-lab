{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odoo.fullname" . }}-web
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "odoo.fullname" . }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "odoo.fullname" . }}
        app.kubernetes.io/component: web
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "odoo.fullname" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: {{ .Values.securityContext.runAsUser }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "odoo.fullname" . }}
              app.kubernetes.io/component: web
      containers:
        - name: odoo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
          ports:
            - name: http
              containerPort: 8069
            - name: longpolling
              containerPort: 8072
          env:
            - name: HOST
              {{- if .Values.database.host }}
              value: {{ .Values.database.host | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_HOST
              {{- end }}
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_PASSWORD
            - name: PORT
              value: {{ .Values.odoo.dbPort | quote }}
            - name: PGSSLMODE
              value: {{ .Values.odoo.dbSslMode | quote }}
            - name: PROXY_MODE
              value: {{ .Values.odoo.proxyMode | quote }}
          args:
            - odoo
            - -c
            - /etc/odoo/config/odoo.conf
            - -d
            - {{ .Values.odoo.dbName | quote }}
          startupProbe:
            httpGet:
              path: /devops/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /devops/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /devops/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: odoo-data
              mountPath: /var/lib/odoo
            - name: odoo-config
              mountPath: /etc/odoo/config/odoo.conf
              subPath: web.conf
      volumes:
        - name: odoo-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-filestore" (include "odoo.fullname" .)) }}
        - name: odoo-config
          configMap:
            name: {{ include "odoo.fullname" . }}-config
{{- end }}
