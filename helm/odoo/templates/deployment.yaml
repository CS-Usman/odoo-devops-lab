apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odoo.fullname" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "odoo.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "odoo.fullname" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.dockerSocket.enabled .Values.dockerSocket.gid }}
      securityContext:
        supplementalGroups:
          - {{ .Values.dockerSocket.gid }}
      {{- end }}
      containers:
        - name: odoo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8069
              {{- if .Values.service.hostPort }}
              hostPort: {{ .Values.service.hostPort }}
              {{- end }}
            - name: longpolling
              containerPort: 8072
              {{- if .Values.service.longpollingHostPort }}
              hostPort: {{ .Values.service.longpollingHostPort }}
              {{- end }}
          env:
            - name: HOST
              {{- if .Values.database.host }}
              value: {{ .Values.database.host | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_HOST
              {{- end }}
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_PASSWORD
            - name: PORT
              value: {{ .Values.odoo.dbPort | quote }}
            - name: PROXY_MODE
              value: {{ .Values.odoo.proxyMode | quote }}
            {{- if .Values.k3sMetrics.enabled }}
            - name: KUBECONFIG
              value: /etc/rancher/k3s/k3s.yaml
            - name: K3S_METRICS_NAMESPACE
              value: {{ .Values.k3sMetrics.namespace | quote }}
            {{- end }}
          args:
            - odoo
            - -d
            - {{ .Values.odoo.dbName | quote }}
          readinessProbe:
            httpGet:
              path: /devops/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /devops/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: odoo-data
              mountPath: /var/lib/odoo
            {{- if .Values.dockerSocket.enabled }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
            {{- end }}
            {{- if .Values.k3sMetrics.enabled }}
            - name: k3s-kubeconfig
              mountPath: /etc/rancher/k3s
              readOnly: true
            - name: k3s-bin
              mountPath: /usr/local/bin/k3s
              readOnly: true
            {{- end }}
      volumes:
        - name: odoo-data
          hostPath:
            path: {{ .Values.persistence.hostPath }}
            type: DirectoryOrCreate
        {{- if .Values.dockerSocket.enabled }}
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- end }}
        {{- if .Values.k3sMetrics.enabled }}
        - name: k3s-kubeconfig
          hostPath:
            path: /etc/rancher/k3s
            type: Directory
        - name: k3s-bin
          hostPath:
            path: /usr/local/bin/k3s
            type: File
        {{- end }}
