{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "odoo.fullname" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.ingress.entryPoint }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "odoo.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
          - path: /websocket
            pathType: Prefix
            backend:
              service:
                name: {{ include "odoo.fullname" . }}
                port:
                  number: {{ .Values.service.longpollingPort }}
{{- end }}
