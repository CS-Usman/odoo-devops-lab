# Staging — http://<VM_IP>:8080/
# DB: postgres-staging pod on VM (not Azure Postgres)
# Staging uses hostPort 8080 (not Traefik — avoids custom Traefik entrypoints on k3s chart v40)

fullnameOverride: odoo-staging

existingSecret: odoo-staging-db

database:
  host: postgres-staging

odoo:
  dbName: odoo_staging

persistence:
  hostPath: /srv/odoo/staging

ingress:
  enabled: false

service:
  hostPort: 8080

resources:
  limits:
    memory: "768Mi"
