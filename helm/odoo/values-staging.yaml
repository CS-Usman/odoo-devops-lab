fullnameOverride: odoo-staging

existingSecret: odoo-staging-db

serviceAccount:
  automountServiceAccountToken: true

# DevOps Monitor: list odoo-staging, postgres-staging, pgbouncer, etc. via metrics-server
metricsApi:
  enabled: true
  podNamePattern: "^(odoo-staging|postgres-staging).*"

odoo:
  dbName: odoo_staging
  dbPort: "5432"
  dbSslMode: disable

web:
  replicas: 1

cron:
  enabled: false

persistence:
  storageClass: managed-csi
  accessMode: ReadWriteOnce
  size: 32Gi

resources:
  limits:
    memory: "768Mi"
