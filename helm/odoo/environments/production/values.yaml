web:
  replicas: 2
  maxCronThreads: 1

cron:
  enabled: false
  replicas: 0

persistence:
  # Azure File RWX — shared across odoo-prod-web replicas (see scripts/migrate-prod-filestore-rwx.sh).
  storageClass: azurefile-csi
  accessMode: ReadWriteMany
  size: 32Gi
  existingClaim: odoo-prod-filestore-rwx

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 2
  targetCPUUtilizationPercentage: 75
