web:
  replicas: 1
  maxCronThreads: 1

cron:
  # Separate cron pod shares RWO filestore PVC with web — only one can mount; use web maxCronThreads until Blob RWX.
  enabled: false
  replicas: 0

persistence:
  # Prefer Blob Fuse CSI → odoo-prod-filestore container (see k8s/storage/README.md).
  storageClass: managed-csi
  accessMode: ReadWriteOnce
  size: 32Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 75
