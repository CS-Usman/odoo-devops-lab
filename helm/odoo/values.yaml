nameOverride: odoo
fullnameOverride: ""

image:
  repository: ghcr.io/cs-usman/odoo-devops-lab
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

existingSecret: odoo-db

database:
  host: ""

odoo:
  dbPort: "5432"
  proxyMode: "true"
  dbName: odoo_devops_lab
  dbSslMode: require

web:
  enabled: true
  replicas: 2
  workers: 2
  maxCronThreads: 0

cron:
  enabled: true
  replicas: 1
  workers: 0
  maxCronThreads: 1

persistence:
  enabled: true
  storageClass: managed-csi
  accessMode: ReadWriteMany
  size: 32Gi
  existingClaim: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1536Mi"
    cpu: "1000m"

service:
  port: 8069
  longpollingPort: 8072

# Public access via ingress-nginx (see k8s/argocd/applications/ingress-nginx.yaml).
# Set host after: kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
# Lab DNS trick: 52-14-0-26.sslip.io resolves to 52.14.0.26
ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "7200"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
  longPolling:
    enabled: true
    path: /longpolling
  # Odoo 17+ bus uses /websocket on the gevent port (8072), not only /longpolling.
  websocket:
    enabled: true
    path: /websocket
  certManager:
    # Set to letsencrypt-prod after ./scripts/install-cert-manager.sh
    clusterIssuer: ""
  tls:
    enabled: false
    secretName: ""
    hosts: []

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  allowPrivilegeEscalation: false

serviceAccount:
  create: true
  automountServiceAccountToken: false

# AKS DevOps Monitor: read pod metrics from metrics-server (see addons/devops_server_monitor).
metricsApi:
  enabled: false
  # Optional regex on pod name (helm → K8S_METRICS_POD_PATTERN). Empty = all pods in namespace.
  podNamePattern: ""
