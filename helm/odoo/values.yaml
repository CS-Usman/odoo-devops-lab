nameOverride: odoo
fullnameOverride: ""

image:
  repository: ghcr.io/cs-usman/odoo-devops-lab
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

existingSecret: odoo-db

database:
  host: ""

odoo:
  dbPort: "5432"
  proxyMode: "true"
  dbName: odoo_devops_lab
  dbSslMode: require

web:
  enabled: true
  replicas: 2
  workers: 2
  maxCronThreads: 0

cron:
  enabled: true
  replicas: 1
  workers: 0
  maxCronThreads: 1

persistence:
  enabled: true
  storageClass: managed-csi
  accessMode: ReadWriteMany
  size: 32Gi
  existingClaim: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1536Mi"
    cpu: "1000m"

service:
  port: 8069
  longpollingPort: 8072

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  allowPrivilegeEscalation: false

serviceAccount:
  create: true
  automountServiceAccountToken: false
