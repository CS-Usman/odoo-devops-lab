# Production — http://<VM_IP>/
# hostPort :80 (no Traefik — ServiceLB unreliable on single-node Azure B2s)

fullnameOverride: odoo-prod

odoo:
  dbName: odoo_devops_lab

persistence:
  hostPath: /srv/odoo/prod

ingress:
  enabled: false

service:
  hostPort: 80

resources:
  limits:
    memory: "1408Mi"
