# kube-prometheus-stack — tuned for odoo-devops-lab (k3s on Azure VM).
# Session A: Prometheus + Grafana + node/kube metrics + Odoo health probes.
# Session D: Alertmanager + prometheus-rules-odoo-lab.yaml

fullnameOverride: monitoring

defaultRules:
  create: true
  rules:
    alertmanager: false
    etcd: false
    kubeScheduler: false
    kubeControllerManager: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # Lab default: fire alerts but no email/Slack yet (receiver: null).
  # Add SMTP or webhook receiver here when ready — see docs/monitoring/README.md
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
      routes:
        - matchers:
            - severity = critical
          receiver: "null"
          repeat_interval: 1h
    receivers:
      - name: "null"

grafana:
  enabled: true
  adminPassword: odoo-lab-change-me
  persistence:
    enabled: false
  # Skip heavy bundled dashboards; load odoo-lab-overview via sidecar ConfigMap.
  defaultDashboardsEnabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
    datasources:
      enabled: false
  # Provision Prometheus without the sidecar container (saves RAM vs sidecar.datasources).
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://monitoring-prometheus.monitoring.svc:9090
          access: proxy
          isDefault: true
          jsonData:
            timeInterval: 60s
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
          jsonData:
            maxLines: 1000
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  readinessProbe:
    initialDelaySeconds: 120
    timeoutSeconds: 15
    periodSeconds: 20
    failureThreshold: 15
  livenessProbe:
    initialDelaySeconds: 300
    timeoutSeconds: 15
    periodSeconds: 30
    failureThreshold: 6
  service:
    type: NodePort
    nodePort: 30300

prometheus:
  enabled: true
  prometheusSpec:
    retention: 3d
    retentionSize: 1GB
    walCompression: true
    scrapeInterval: 60s
    evaluationInterval: 60s
    # Discover ServiceMonitors / Probes cluster-wide (not only Helm-owned).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 400m
        memory: 384Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

# k3s runs control plane on the node; these components are not exposed as pods.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
