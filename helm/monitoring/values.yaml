# kube-prometheus-stack — tuned for odoo-devops-lab (k3s on 4 GB Azure VM).
# Session A: Prometheus + Grafana + node/kube metrics + Odoo health probes.
# Loki and Alertmanager come in later sessions.

fullnameOverride: monitoring

defaultRules:
  create: true
  rules:
    alertmanager: false
    etcd: false
    kubeScheduler: false
    kubeControllerManager: false

alertmanager:
  enabled: false

grafana:
  enabled: true
  adminPassword: odoo-lab-change-me
  persistence:
    enabled: false
  # Lighter startup on 4 GB VM — skip bundled dashboards (add in Session B).
  defaultDashboardsEnabled: false
  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  readinessProbe:
    initialDelaySeconds: 90
    timeoutSeconds: 10
    periodSeconds: 15
    failureThreshold: 10
  livenessProbe:
    initialDelaySeconds: 180
    timeoutSeconds: 10
    periodSeconds: 30
    failureThreshold: 5
  service:
    type: NodePort
    nodePort: 30300

prometheus:
  enabled: true
  prometheusSpec:
    retention: 3d
    retentionSize: 1GB
    walCompression: true
    scrapeInterval: 60s
    evaluationInterval: 60s
    # Discover ServiceMonitors / Probes cluster-wide (not only Helm-owned).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 400m
        memory: 384Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

# k3s runs control plane on the node; these components are not exposed as pods.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
