# prometheus-blackbox-exporter — separate chart (not part of kube-prometheus-stack).
# Probes Odoo /devops/health via ServiceMonitors discovered by Prometheus.
# Odoo werkzeug often responds with HTTP/1.0 — include it or probe_success stays 0.
config:
  modules:
    http_2xx:
      prober: http
      timeout: 30s
      http:
        follow_redirects: true
        preferred_ip_protocol: ip4
        valid_http_versions: ["HTTP/1.0", "HTTP/1.1", "HTTP/2.0"]

serviceMonitor:
  enabled: true
  defaults:
    labels:
      release: monitoring
    interval: 60s
    scrapeTimeout: 30s
  targets:
    - name: odoo-prod-health
      url: http://odoo-prod.odoo.svc.cluster.local:8069/devops/health
      labels:
        app: odoo
        env: prod
    - name: odoo-staging-health
      url: http://odoo-staging.odoo.svc.cluster.local:8069/devops/health
      labels:
        app: odoo
        env: staging

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
