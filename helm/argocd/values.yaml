# Argo CD — sized for AKS lab cluster (2 worker VMs).

global:
  domain: argocd.local

server:
  service:
    type: ClusterIP
  extraArgs:
    - --insecure

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

applicationSet:
  enabled: false

notifications:
  enabled: false
