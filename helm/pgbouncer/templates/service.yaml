apiVersion: v1
kind: Service
metadata:
  name: {{ include "pgbouncer.fullname" . }}
  labels:
    {{- include "pgbouncer.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "pgbouncer.fullname" . }}
  ports:
    - name: pgbouncer
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
