replicaCount: 2

image:
  repository: edoburu/pgbouncer
  tag: "v1.23.1-p3"
  pullPolicy: IfNotPresent

service:
  port: 5432
  targetPort: 5432

# Secret keys: POSTGRES_HOST (Azure FQDN), DB_USER, DB_PASSWORD, POSTGRES_DB
existingSecret: odoo-db

# When true, do not set DB_NAME in the container — edoburu configures "* = host=<Azure>"
# so Odoo can use postgres (bootstrap) and odoo_devops_lab through the same pool.
useWildcardDatabase: true

poolMode: session
defaultPoolSize: 20
maxClientConn: 200

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: true
