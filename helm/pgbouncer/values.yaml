replicaCount: 2

image:
  repository: edoburu/pgbouncer
  tag: "1.23.1-p0"
  pullPolicy: IfNotPresent

service:
  port: 5432
  targetPort: 5432

# Secret keys: POSTGRES_HOST (Azure FQDN), DB_USER, DB_PASSWORD, POSTGRES_DB
existingSecret: odoo-db

poolMode: session
defaultPoolSize: 20
maxClientConn: 200

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: true
