name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cs-usman/odoo-devops-lab
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/cs-usman/odoo-devops-lab:latest
          push: false

      - name: Trivy scan (before push)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/cs-usman/odoo-devops-lab:latest
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure VM (k3s)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,IMAGE_TAG
          command_timeout: 20m
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            cd ~/odoo-devops-lab
            git pull origin main
            chmod +x scripts/*.sh
            # deploy-k8s.sh disables Traefik and rolls out Odoo on hostPort :80/:8080
            ./scripts/deploy-k8s.sh

      - name: Smoke test
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
