name: Build and push Docker image (staging)

on:
  push:
    branches: [staging]
    paths-ignore:
      - helm/odoo/environments/staging/image-tag.yaml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cs-usman/odoo-devops-lab
          tags: |
            type=sha,prefix=,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/cs-usman/odoo-devops-lab:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

  gitops-staging:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update staging image tag (GitOps)
        run: |
          FILE=helm/odoo/environments/staging/image-tag.yaml
          sed -i "s/tag:.*/tag: \"${GITHUB_SHA}\"/" "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git diff --staged --quiet && exit 0
          git commit -m "gitops(staging): bump Odoo image to ${GITHUB_SHA}"
          pushed=0
          for attempt in 1 2 3; do
            git pull --rebase origin staging
            if git push origin staging; then
              pushed=1
              break
            fi
            sleep 5
          done
          test "$pushed" -eq 1
